spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/whatsappai_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6381
      password: ${REDIS_PASSWORD:redis}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false


evolution:
  api:
    base-url: ${EVOLUTION_API_BASE_URL:http://localhost:8081}

logging:
  level:
    org.hibernate.SQL: DEBUG
